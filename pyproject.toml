[project]
name = "bank-marketing-service"
version = "0.1.0"
description = "ML service for predicting subscription to a deposit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.164.0",
    "joblib>=1.6.0",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]


[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
